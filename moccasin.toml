[project]
src = "src"
out = "out"
dot_env = ".env"
dependencies = ["snekmate"]

# Chainlink price feed for the chain's native coin in USD: the coin users
# lock as collateral (ETH on Ethereum, Arbitrum and Base, MON on Monad, S on
# Sonic). Never pin an ETH/USD feed on a chain whose native coin isn't ETH.
# Live networks pin the real feed address below; local networks (pyevm,
# anvil) deploy a mock instead.
#
# Live networks also set `extra_data.oracle_timeout`: the feed's heartbeat
# plus a buffer, so routine update delays don't block price reads.
# Heartbeats: https://data.chain.link (checked 2026-10-18).
[networks.contracts.native_usd_price_feed]
deployer_script = "deploy_mocks.py"

[networks.pyevm]
is_zksync = false

[networks.anvil]
url = "http://127.0.0.1:8545"
prompt_live = false
save_to_db = false
chain_id = 31337

[networks.sepolia]
url = "https://ethereum-sepolia-rpc.publicnode.com"
chain_id = 11155111
explorer_uri = "https://api.etherscan.io/v2/api"
explorer_type = "etherscan"
explorer_api_key = "${ETHERSCAN_API_KEY}"

[networks.sepolia.extra_data]
oracle_timeout = 4500  # 3600s heartbeat + 900s

[networks.sepolia.contracts.native_usd_price_feed]
address = "0x694AA1769357215DE4FAC081bf1f309aDC325306"

[networks.mainnet]
url = "${MAINNET_RPC_URL}"
chain_id = 1
explorer_uri = "https://api.etherscan.io/v2/api"
explorer_type = "etherscan"
explorer_api_key = "${ETHERSCAN_API_KEY}"
prompt_live = true

[networks.mainnet.extra_data]
oracle_timeout = 4500  # 3600s heartbeat + 900s

[networks.mainnet.contracts.native_usd_price_feed]
address = "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419"

[networks.arbitrum]
url = "${ARBITRUM_RPC_URL}"
chain_id = 42161
explorer_uri = "https://api.etherscan.io/v2/api"
explorer_type = "etherscan"
explorer_api_key = "${ETHERSCAN_API_KEY}"
prompt_live = true

[networks.arbitrum.extra_data]
oracle_timeout = 2400  # 1755s heartbeat + 645s

[networks.arbitrum.contracts.native_usd_price_feed]
address = "0x639Fe6ab55C921f74e7fac1ee960C0B6293ba612"

# Chainlink L2 sequencer uptime feed: price reads revert while the
# sequencer is down and for an hour after it comes back.
[networks.arbitrum.contracts.sequencer_uptime_feed]
address = "0xFdB631F5EE196F0ed6FAa767959853A9F217697D"

[networks.base]
url = "${BASE_RPC_URL}"
chain_id = 8453
explorer_uri = "https://api.etherscan.io/v2/api"
explorer_type = "etherscan"
explorer_api_key = "${ETHERSCAN_API_KEY}"
prompt_live = true

[networks.base.extra_data]
oracle_timeout = 1800  # 1200s heartbeat + 600s

# Chainlink ETH/USD (8 decimals). Deviation 0.15%.
[networks.base.contracts.native_usd_price_feed]
address = "0x71041dddad3595F9CEd3DcCFBe3D1F4b0a16Bb70"

# Chainlink L2 sequencer uptime feed: price reads revert while the
# sequencer is down and for an hour after it comes back.
[networks.base.contracts.sequencer_uptime_feed]
address = "0xBCF85224fc0756B9Fa45aA7892530B47e10b6433"

[networks.monad]
url = "${MONAD_RPC_URL}"
chain_id = 143
explorer_uri = "https://api.etherscan.io/v2/api"
explorer_type = "etherscan"
explorer_api_key = "${ETHERSCAN_API_KEY}"
prompt_live = true

[networks.monad.extra_data]
oracle_timeout = 4500  # 3600s heartbeat + 900s

[networks.monad.contracts.native_usd_price_feed]
address = "0xBcD78f76005B7515837af6b50c7C52BCf73822fb"

[networks.monad_testnet]
url = "${MONAD_TESTNET_RPC_URL}"
chain_id = 10143
explorer_uri = "https://api.etherscan.io/v2/api"
explorer_type = "etherscan"
explorer_api_key = "${ETHERSCAN_API_KEY}"
prompt_live = true

[networks.monad_testnet.extra_data]
# No Chainlink MON/USD feed on this chain. The deploy script deploys an
# owner-gated mock that answers $2000. A year, so that answer does not go
# stale while the deployer is the one updating it.
oracle_timeout = 31536000

[networks.sonic]
url = "${SONIC_RPC_URL}"
chain_id = 146
explorer_uri = "https://api.etherscan.io/v2/api"
explorer_type = "etherscan"
explorer_api_key = "${ETHERSCAN_API_KEY}"
prompt_live = true

[networks.sonic.extra_data]
oracle_timeout = 90000  # 86400s heartbeat + 3600s

# Chainlink S/USD (8 decimals).
[networks.sonic.contracts.native_usd_price_feed]
address = "0xc76dFb89fF298145b417d221B2c747d84952e01d"
